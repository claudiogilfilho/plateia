name: CI

on:
  push:
    branches: [main, feat/observatorio-plateia-v2]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm observatory:migrate:v3:check
      - run: pnpm observatory:verify:v3
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
